name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p app/src/main/java/com/novelvoz
          if [ -f app-build.gradle.kts ]; then mv app-build.gradle.kts app/build.gradle.kts; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f MainActivity.kt ]; then mv MainActivity.kt app/src/main/java/com/novelvoz/; fi
          if [ -f ReaderService.kt ]; then mv ReaderService.kt app/src/main/java/com/novelvoz/; fi
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NovelVoz v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
